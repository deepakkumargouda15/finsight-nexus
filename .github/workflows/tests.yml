name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --default-timeout=120 --retries=10 -r requirements-dev.txt
      - name: Verify Streamlit AppTest is installed (do not silently skip UI smoke tests)
        run: python -c "from streamlit.testing.v1 import AppTest; print('Streamlit AppTest available')"
      - name: Run test suite (including Streamlit AppTest smoke tests)
        run: python -m pytest -q -ra
      - name: Compile application, source, and tests
        run: python -m compileall -q app.py src tests
